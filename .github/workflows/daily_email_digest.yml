name: daily-email-digest

# watch-and-notifyワークフロー(.github/workflows/watch_and_notify.yml)の
# 完了イベント(workflow_run)でのみ起動する。固定時刻のcronは持たない。
#
# 以前は平日9:00 JSTに前営業日分をまとめる仕様だったが、2026-09-30に
# ユーザー指摘で「当日分を当日中に」変更し、その後は「平日16:30 JST固定
# cron」（watch_and_notify.pyの最終実行枠16:10 JSTの後に猶予を見込んだ
# 時刻）で実装した。しかしCodexレビューで、固定時刻に頼る設計そのものに
# 以下の欠陥を指摘された（詳細はscripts/send_daily_email.pyのモジュール
# docstring参照）:
#   - watch_and_notify.py側のschedule実行自体が16:30より後にずれ込むと
#     当日分の一部が永久にメールから漏れる
#   - その対策でworkflow_runトリガーを追加すると、今度は16:30固定cronと
#     の両方から重複送信されうる（このワークフローは読み取り専用で
#     送信済みマーカーを自分で書けないため、時刻ガードだけでは防げない）
#   - 「15:00 JST以降か」のような時刻だけの判定では、遅延した13:00枠を
#     最終実行枠(16:10)と誤認しうる
#   - watch-and-notify側が失敗した日も「該当銘柄なし」の当日分として
#     誤って空メールを送ってしまう
#
# これらは全て「いつ実行されたか」の推測に頼っていたことが原因のため、
# 固定cronをやめてworkflow_run一本に絞り、watch_and_notify.py自身が
# notify_state.jsonに書き込む実行実績のマーカー(state["last_run_schedule"]
# 等。github.event.scheduleをそのまま使うため実行時刻がずれても「どの
# cronで発火したか」を誤らない)で判定するようscripts/send_daily_email.py
# 側を作り直した（2026-09-30）。
#
# それでもworkflow_run一本に絞っただけでは、10:00・13:00枠の完了イベント
# に起因する起動がジョブ開始待ち等でたまたま16:10枠のpush後に状態を
# 読んでしまうと重複送信されうるとCodexレビューで指摘され、
# TRIGGERING_RUN_ID（このワークフローを起動したwatch-and-notify実行の
# ID）をstate["last_run_id"]と突き合わせる相関チェックを追加した。
# 詳細はscripts/send_daily_email.pyのモジュールdocstring参照。
# recovery_date（手動リカバリで対象にしたい日付、YYYY-MM-DD）: 省略時は
# state["last_run_date"]をそのまま使う。last_run_dateはwatch_and_notify.py
# の実行のたびに（最終実行枠かどうかを問わず）更新される単一の値のため、
# 前日分の送信に失敗した後、リカバリ操作前に当日の10:00・13:00枠が実行
# されるとlast_run_dateが当日に上書きされてしまい、本来リカバリしたかった
# 前日分ではなく不完全な当日分を対象にしてしまう可能性がある
# （2026-09-30のCodexレビューで指摘・修正）。前日分等を明示的にリカバリ
# したい場合はこの入力に日付を指定して手動実行する。
on:
  workflow_run:
    workflows: ["watch-and-notify"]
    types: [completed]
  workflow_dispatch:
    inputs:
      recovery_date:
        description: "手動リカバリで対象にする日付(YYYY-MM-DD、省略可)"
        required: false
        type: string

# data/notify_state.jsonを読むだけで書き換えない（notify-stateブランチへの
# pushはwatch_and_notify.yml側のみが行う）ため、書き込み権限は不要。
permissions:
  contents: read

jobs:
  daily-email-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # watch_and_notify.ymlのRestoreステップと同じロジック。こちらは読み取り
      # 専用なので、Pushステップは無い（notify-stateブランチは変更しない）。
      - name: Restore notify state from the notify-state branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code origin notify-state >/dev/null 2>&1; then
            git fetch origin notify-state:refs/remotes/origin/notify-state
            git show origin/notify-state:notify_state.json > data/notify_state.json.tmp
            python -c "import json; json.load(open('data/notify_state.json.tmp', encoding='utf-8'))"
            mv data/notify_state.json.tmp data/notify_state.json
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              echo '{"notified": {}}' > data/notify_state.json
              echo "notify-state branch does not exist yet, starting fresh"
            else
              echo "::error::notify-stateブランチの存在確認に失敗しました(git ls-remote exit=$code)。"
              exit 1
            fi
          fi

      - name: Send daily email digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          # workflow_dispatch（手動実行）の場合はマーカーによるガードを
          # 無効化し、いつでも強制送信できるようにする（動作確認・手動
          # リカバリ用）。
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' }}
          # このワークフロー自身を起動したwatch-and-notifyの実行ID。
          # notify_state.json側のstate["last_run_id"]（watch_and_notify.py
          # 参照）と突き合わせ、10:00・13:00枠の完了イベントに起因する
          # 起動がジョブ開始待ち等でたまたま16:10枠のpush後に状態を読んで
          # しまうことによる重複送信を防ぐ（2026-09-30のCodexレビューで
          # 指摘・修正。scripts/send_daily_email.pyのモジュールdocstring
          # 参照）。workflow_run以外のイベントでは空になる。
          TRIGGERING_RUN_ID: ${{ github.event.workflow_run.id }}
          RECOVERY_DATE: ${{ github.event.inputs.recovery_date }}
        run: python scripts/send_daily_email.py
